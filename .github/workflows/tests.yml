name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC — full-pipeline smoke test only (see smoke-test job).
    - cron: "0 6 * * 1"

jobs:
  # Detects PRs touching files where fast-tests can't catch a regression:
  # fast-tests only exercises numpy/opencv/scikit-learn code paths and never
  # touches torch/ultralytics/supervision, so a change to the pinned CV/ML
  # deps or to the detector/tracker/camera-motion modules needs the real
  # pipeline run (pytest -m slow) to be verified.
  changes:
    name: Detect sensitive changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.check.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for detection/tracking-sensitive changes
        id: check
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(requirements\.txt|config\.py|src/(yolo_detector|tracker|camera_motion)\.py)$'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

  fast-tests:
    name: Fast tests (pytest -m "not slow")
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Fast tests (team assigner, ball assigner, speed/distance, pipeline
      # integration) only exercise numpy/opencv/scikit-learn code paths in
      # src/ — never torch/ultralytics/supervision. Installing just this
      # subset keeps every push/PR run fast and free of large downloads.
      # NOTE: keep these pins in sync with requirements.txt by hand;
      # Dependabot does not update this list.
      - name: Install fast-test dependencies
        run: pip install pytest numpy==2.5.1 opencv-python==5.0.0.93 scikit-learn==1.9.0

      - name: Run fast tests
        run: pytest -m "not slow"

  smoke-test:
    name: Full pipeline smoke test (pytest -m slow)
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && needs.changes.outputs.sensitive == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full-pipeline smoke test
        env:
          YOLO_DEVICE: cpu
        run: pytest -m slow
