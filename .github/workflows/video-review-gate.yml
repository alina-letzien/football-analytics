name: Video Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changes:
    name: Detect sensitive changes
    runs-on: ubuntu-latest
    outputs:
      sensitive: ${{ steps.check.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for detection/tracking-sensitive changes
        id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          # Keep this regex in sync with the identical one in
          # .github/workflows/tests.yml's `changes` job — the two gates
          # (smoke-test trigger, merge-block) will silently desync if only
          # one is updated.
          if echo "$CHANGED" | grep -Eq '^(requirements\.txt|config\.py|src/(yolo_detector|tracker|camera_motion)\.py)$'; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

  video-review-gate:
    name: Require video-reviewed label on sensitive PRs
    needs: changes
    # Fail closed: run the gate unless `changes` explicitly determined the
    # PR is not sensitive. If `changes` errors/is cancelled and never sets
    # its output, `sensitive` is unset (not 'false'), so this still runs the
    # gate instead of silently skipping a required check.
    if: always() && needs.changes.outputs.sensitive != 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Strip stale label on new commits
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On a fork PR, GITHUB_TOKEN is read-only, so this silently no-ops
        # (|| true) and a stale label can survive a push. Not a concern for
        # this single-owner, no-forks repo; revisit if that ever changes.
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label video-reviewed || true

      - name: Check current label state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          echo "Current labels: $CURRENT"
          echo "$CURRENT" | grep -qx "video-reviewed" || {
            echo "::error::Missing 'video-reviewed' label. Download the smoke-test-output artifact from the latest Tests run, watch output/analysis.mp4, then add the video-reviewed label before merging. (This also fires if the 'changes' job failed to detect sensitivity rather than genuinely found this PR sensitive — check that job's logs if this PR shouldn't need review.)"
            exit 1
          }
